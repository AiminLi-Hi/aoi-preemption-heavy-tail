name: Publish tailor-aoi to PyPI

# Runs when a GitHub release is published, or manually from the Actions tab.
# Uses PyPI Trusted Publishing (OpenID Connect): no API token is stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build python
          python -m twine check python/dist/*
      - name: Test the built wheel
        run: |
          python -m pip install "$(ls python/dist/*.whl)[test]"
          python -m pytest -q python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tailor-aoi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
